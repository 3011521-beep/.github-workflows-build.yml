name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o -q project.zip -d src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: src
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp src/app/build/outputs/apk/debug/app-debug.apk kol-baderech.apk

      # בדיקות (PR / ענף): מעלה את הקובץ כ-artifact בלי לפרסם גרסה
      - name: Upload APK (test build)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: kol-baderech-test-apk
          path: kol-baderech.apk
          retention-days: 14

      # גרסה רשמית רק מ-main – כדי שהעדכון האוטומטי באפליקציה לא יקבל גרסאות ניסיון
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: build-${{ github.run_number }}
          name: קול בדרך - גרסה ${{ github.run_number }}
          files: kol-baderech.apk
